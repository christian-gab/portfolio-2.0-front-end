    <script>
      try {
        const storedTheme = localStorage.getItem('portfolio-theme')
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches

        if (storedTheme === 'dark' || (storedTheme === null && systemPrefersDark)) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
        }
      } catch {
        // Apply the default light theme when browser storage or preference APIs are restricted.
      }
    </script>
    <title>Portfólio | Christian Gabriel — Desenvolvedor Frontend</title>
